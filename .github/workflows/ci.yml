name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -v

      - name: Build Docker image
        run: docker build -t diabetes-api .

      - name: Run container
        run: docker run -d -p 8000:8000 --name api diabetes-api

      - name: Wait for API
        run: |
          for i in $(seq 1 30); do curl -sf http://localhost:8000/health && exit 0; sleep 2; done
          docker logs api; exit 1

      - name: Test endpoints
        run: |
          curl -sf http://localhost:8000/model-info
          curl -sf -X POST http://localhost:8000/predict -H "Content-Type: application/json" -d @sample_request.json
